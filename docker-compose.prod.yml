services:
  web:
    image: ${APP_IMAGE:-ghcr.io/mukundkhandelwal463/royalwheels:latest}
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-royalwheels}
      POSTGRES_USER: ${POSTGRES_USER:-royalwheels}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-royalwheels_prod_secret_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-royalwheels} -d ${POSTGRES_DB:-royalwheels}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  postgres_data:
