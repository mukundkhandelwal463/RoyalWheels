name: CI/CD Pipeline - Test, Build & Deploy to AWS EC2

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Django Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Tests
        env:
          DJANGO_SECRET_KEY: "test-secret-key-for-ci"
          DJANGO_DEBUG: "True"
        run: |
          python backend/manage.py test app

  build-and-push:
    name: Build & Push Docker Image to GHCR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Docker Compose & Nginx configs to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,nginx/nginx.conf"
          target: "/home/ubuntu/royalwheels"

      - name: Deploy & Restart Containers on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /home/ubuntu/royalwheels

            # Create production .env file if it does not exist
            if [ ! -f .env ]; then
              echo "Initializing production .env file..."
              cat << 'EOF' > .env
            DJANGO_DEBUG=False
            DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY || 'royalwheels-insecure-prod-key-please-change' }}
            DJANGO_ALLOWED_HOSTS=*
            DJANGO_CSRF_TRUSTED_ORIGINS=http://${{ secrets.EC2_HOST }},http://${{ secrets.EC2_HOST }}:8000
            DATABASE_URL=postgres://royalwheels:royalwheels_prod_secret_2026@db:5432/royalwheels?sslmode=disable
            RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID || 'rzp_test_SP3i66YQhXqLBL' }}
            RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET || 'z6pWQU7jZrWBNaxCvW200rZR' }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID || '966370438424-vom7tebiasvcjnu5bmr0aubk9c6l2o9e.apps.googleusercontent.com' }}
            EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER || 'royalwheel342@gmail.com' }}
            EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD || 'tuma cnen lcpv sinu' }}
            CLOUDINARY_URL=${{ secrets.CLOUDINARY_URL || 'cloudinary://854692115196243:uKbRcmG_0VuRZQKUQ-Vb2EN84mE@dobkjcr8t' }}
            DJANGO_SECURE_SSL_REDIRECT=false
            POSTGRES_DB=royalwheels
            POSTGRES_USER=royalwheels
            POSTGRES_PASSWORD=royalwheels_prod_secret_2026
            EOF
            fi

            # Export APP_IMAGE pointing to the newly pushed GHCR tag
            export APP_IMAGE="ghcr.io/${{ github.repository }}:latest"

            # Log into GHCR on EC2
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull updated image and start services
            echo "Pulling latest Docker images..."
            docker compose -f docker-compose.prod.yml pull

            echo "Starting containers..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "Running database migrations..."
            docker compose -f docker-compose.prod.yml exec -T web python manage.py migrate --noinput

            echo "Collecting static files..."
            docker compose -f docker-compose.prod.yml exec -T web python manage.py collectstatic --noinput

            echo "Pruning stale docker images..."
            docker image prune -f

            echo "Deployment completed successfully!"

      - name: Healthcheck Verification
        run: |
          echo "Verifying service health on http://${{ secrets.EC2_HOST }}/healthz/..."
          sleep 5
          curl --retry 6 --retry-delay 5 --retry-connrefused -f "http://${{ secrets.EC2_HOST }}/healthz/" || curl --retry 5 --retry-delay 5 --retry-connrefused -f "http://${{ secrets.EC2_HOST }}:8000/healthz/"
          echo "Healthcheck passed! RoyalWheels is LIVE!"
